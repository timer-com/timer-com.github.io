<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Интерактивная среда Triton (.tn)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #1a1a1f; color: #f5f5f5; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 35%; background: #111115; border-right: 2px solid #2d2d3d; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; background: #0b0b0e; border-bottom: 1px solid #2d2d3d; }
        .sidebar-header h2 { color: #3ba2ff; font-size: 22px; margin-bottom: 4px; }
        .search-box { width: 100%; padding: 10px; background: #1e1e24; border: 1px solid #3d3d4f; color: #fff; border-radius: 6px; outline: none; margin-top: 10px; }
        .functions-list { flex: 1; overflow-y: auto; padding: 15px; }
        .func-group-title { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin: 15px 0 8px 0; font-weight: bold; }
        .func-card { background: #1a1a1f; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #3ba2ff; cursor: pointer; transition: 0.2s; }
        .func-card:hover { background: #23232a; }
        .func-name { font-family: monospace; font-weight: bold; color: #00ffb3; font-size: 15px; }
        .func-desc { font-size: 13px; color: #ccc; margin: 5px 0; line-height: 1.4; }
        .func-example { background: #0b0b0e; padding: 6px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #ffcb6b; margin-top: 5px; }
        .workspace { width: 65%; display: flex; flex-direction: column; background: #141419; }
        .editor-container { flex: 6; display: flex; flex-direction: column; }
        .toolbar { padding: 12px 20px; background: #0b0b0e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d2d3d; }
        .btn-run { background: #2ecc71; color: white; border: none; padding: 10px 24px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-run:hover { background: #27ae60; }
        textarea { flex: 1; background: #141419; color: #e0e0e4; font-family: monospace; font-size: 16px; padding: 20px; border: none; resize: none; outline: none; line-height: 1.6; }
        .console-container { flex: 4; background: #08080c; border-top: 2px solid #2d2d3d; display: flex; flex-direction: column; }
        .console-header { padding: 10px 20px; background: #111115; font-size: 12px; color: #666; text-transform: uppercase; }
        .console-output { flex: 1; padding: 20px; font-family: monospace; font-size: 14px; overflow-y: auto; color: #00ff00; white-space: pre-wrap; }
        .error { color: #ff5252; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Язык Triton (.tn)</h2>
            <input type="text" id="search" class="search-box" placeholder="Поиск среди 50 функций...">
        </div>
        <div class="functions-list" id="functions-list"></div>
    </div>

    <div class="workspace">
        <div class="editor-container">
            <div class="toolbar">
                <span>Редактор кода Triton v1.0</span>
                <button class="btn-run" onclick="runTriton()">Запустить код ▶</button>
            </div>
            <textarea id="editor" spellcheck="false"># Базовый тест среды разработки Triton
вывод("--- Проверка строк ---")
переменная текст = "  программирование на тритоне  "
переменная чистый = убрать_пробелы(текст)
вывод("Очищено: " + чистый)
вывод("В верхнем регистре: " + аппер(чистый))

вывод("\n--- Проверка математики ---")
переменная х = -25
вывод("Модуль числа х: " + модуль(х))
вывод("Случайное число от 10 до 50: " + случайно(10, 50))

вывод("\n--- Работа со списками ---")
переменная список = массив_создать(10, 20, 30)
массив_добавить(список, 40)
вывод("Длина массива: " + длина(список))
</textarea>
        </div>
        <div class="console-container">
            <div class="console-header">Терминал Triton</div>
            <div class="console-output" id="console"></div>
        </div>
    </div>

    <script>
        var tritonDocs = [];
        var rawFuncs = [
            "Базовые|вывод(значение)|Выводит текст или переменную в консоль.|вывод('Привет!')",
            "Базовые|тип(объект)|Возвращает тип данных объекта.|тип(123)",
            "Базовые|пусто(объект)|Проверяет, пусто ли значение (null/undefined).|пусто(х)",
            "Базовые|длина(объект)|Возвращает длину строки или размер массива.|длина('Тритон')",
            "Строки|аппер(строка)|Переводит строку в ВЕРХНИЙ регистр.|аппер('привет')",
            "Строки|ловер(строка)|Переводит строку в нижний регистр.|ловер('ПРИВЕТ')",
            "Строки|убрать_пробелы(строка)|Удаляет пробелы по краям строки.|убрать_пробелы('  текст  ')",
            "Строки|замена(строка, что, чем)|Заменяет подстроку в строке.|замена('Кот', 'К', 'Р')",
            "Строки|содержит(строка, подстрока)|Проверяет наличие подстроки.|содержит('Тритон', 'три')",
            "Строки|разбить(строка, разделитель)|Разбивает строку в массив.|разбить('а,б,в', ',')",
            "Строки|повторить_стр(строка, раз)|Повторяет строку N раз.|повторить_стр('Ха', 3)",
            "Строки|индекс_стр(строка, подстрока)|Возвращает позицию подстроки.|индекс_стр('Тритон', 'т')",
            "Строки|срез(строка, старт, конец)|Вырезает кусок строки.|срез('Программа', 0, 3)",
            "Строки|начинается_с(строка, подстрока)|Проверяет начало строки.|начинается_с('Тритон', 'Три')",
            "Строки|заканчивается_на(строка, подстрока)|Проверяет конец строки.|заканчивается_на('Тритон', 'он')",
            "Строки|символ_в(строка, индекс)|Символ на указанной позиции.|символ_в('Код', 1)",
            "Строки|код_символа(строка, индекс)|Коде Юникода символа.|код_символа('A', 0)",
            "Строки|из_кода_символа(число)|Символ из кода Юникода.|из_кода_символа(65)",
            "Математика|корень(число)|Квадратный корень числа.|корень(49)",
            "Математика|модуль(число)|Абсолютное значение числа.|модуль(-99)",
            "Математика|округление(число)|Округляет до ближайшего целого.|округление(5.6)",
            "Математика|округлить_вниз(число)|Округляет в меньшую сторону.|округлить_вниз(5.9)",
            "Математика|округлить_вверх(число)|Округляет в большую сторону.|округлить_вверх(5.1)",
            "Математика|степень(база, эксп)|Возведение числа в степень.|степень(2, 3)",
            "Математика|случайно(мин, макс)|Случайное число в диапазоне.|случайно(1, 10)",
            "Математика|макс(а, б)|Наибольшее из вызванных чисел.|макс(45, 89)",
            "Математика|мин(а, б)|Наименьшее из двух чисел.|мин(12, 3)",
            "Математика|пи()|Возвращает число Пи.|пи()",
            "Математика|синус(число)|Синус угла в радианах.|синус(1)",
            "Математика|косинус(число)|Косинус угла в радианах.|косинус(1)",
            "Математика|тангенс(число)|Тангенс угла.|тангенс(1)",
            "Математика|лог(число)|Натуральный логарифм.|лог(10)",
            "Массивы|массив_создать(...эл)|Создает новый массив.|массив_создать(1, 2, 3)",
            "Массивы|массив_добавить(мас, эл)|Добавляет элемент в конец.|массив_добавить(список, 10)",
            "Массивы|массив_удалить_последний(мас)|Удаляет последний элемент.|массив_удалить_последний(список)",
            "Массивы|массив_объединить(мас, разд)|Склеивает массив в строку.|массив_объединить(список, '-')",
            "Массивы|массив_развернуть(мас)|Переворачивает массив.|массив_развернуть(список)",
            "Массивы|массив_сортировать(мас)|Сортирует элементы массива.|массив_сортировать(список)",
            "Массивы|массив_индекс(мас, эл)|Ищет индекс элемента.|массив_индекс(список, 20)",
            "Массивы|массив_вырезать(мас, от, до)|Вырезает часть массива.|массив_вырезать(список, 0, 2)",
            "Массивы|массив_заполнить(мас, знач)|Заполняет массив значением.|массив_заполнить(список, 0)",
            "Массивы|массив_включает(мас, эл)|Проверяет элемент в массиве.|массив_включает(список, 5)",
            "Типы данных|в_строку(значение)|Преобразует значение в строку.|в_строку(500)",
            "Типы данных|в_число(строка)|Преобразует строку в число.|в_число('15.5')",
            "Типы данных|это_число(значение)|Проверяет, является ли числом.|это_число('123')",
            "Типы данных|это_массив(значение)|Проверяет, является ли массивом.|это_массив(список)",
            "Системные|время_сейчас()|Метка времени в миллисекундах.|время_сейчас()",
            "Системные|дата_текст()|Текущая дата и время текстом.|дата_текст()",
            "Системные|ошибка(текст)|Вызывает принудительную ошибку.|ошибка('Крах!')",
            "Системные|айди_программы()|Генерирует уникальный UUID сессии.|айди_программы()"
        ];

        rawFuncs.forEach(function(str) {
            var parts = str.split('|');
            tritonDocs.push({ group: parts[0], name: parts[1], desc: parts[2], ex: parts[3] });
        });

        var listContainer = document.getElementById('functions-list');
        function renderDocs(filter) {
            filter = filter || "";
            listContainer.innerHTML = "";
            var groups = {};
            
            tritonDocs.forEach(function(f) {
                if(filter && !f.name.toLowerCase().includes(filter.toLowerCase()) && !f.desc.toLowerCase().includes(filter.toLowerCase())) return;
                if(!groups[f.group]) groups[f.group] = [];
                groups[f.group].push(f);
            });
            
            for (var key in groups) {
                var title = document.createElement('div');
                title.className = "func-group-title";
                title.innerText = key;
                listContainer.appendChild(title);
                
                groups[key].forEach(function(func) {
                    var card = document.createElement('div');
                    card.className = "func-card";
                    
                    var nameDiv = document.createElement('div');
                    nameDiv.className = "func-name";
                    nameDiv.innerText = func.name;
                    
                    var descDiv = document.createElement('div');
                    descDiv.className = "func-desc";
                    descDiv.innerText = func.desc;
                    
                    var exDiv = document.createElement('div');
                    exDiv.className = "func-example";
                    exDiv.innerText = "Пример: " + func.ex;
                    
                    card.appendChild(nameDiv);
                    card.appendChild(descDiv);
                    card.appendChild(exDiv);
                    
                    card.onclick = function() {
                        var ed = document.getElementById('editor');
                        ed.value += "\n" + func.ex;
                        ed.focus();
                    };
                    listContainer.appendChild(card);
                });
            }
        }
        renderDocs();
        document.getElementById('search').addEventListener('input', function(e) { renderDocs(e.target.value); });

        function runTriton() {
            var consoleOut = document.getElementById('console');
            consoleOut.innerHTML = ""; 
            var code = document.getElementById('editor').value;
            var outputBuffer = "";
            window.tritonLog = function(val) { 
                outputBuffer += (typeof val === 'object' ? JSON.stringify(val) : val) + "\n"; 
            };

            try {
                code = code.replace(/#.*$/gm, '');
                code = code.replace(/переменная\s+(\w+)\s*=/g, 'let $1 =');
                code = code.replace(/\bистина\b/g, 'true').replace(/\bложь\b/g, 'false');
                
                code = code.replace(/вывод\((.*?)\)/g, 'tritonLog($1)');
                code = code.replace(/тип\((.*?)\)/g, '(typeof ($1))');
                code = code.replace(/пусто\((.*?)\)/g, '($1 === null || $1 === undefined)');
                code = code.replace(/длина\((.*?)\)/g, '($1).length');
                code = code.replace(/аппер\((.*?)\)/g, '($1).toUpperCase()');
                code = code.replace(/ловер\((.*?)\)/g, '($1).toLowerCase()');
                code = code.replace(/убрать_пробелы\((.*?)\)/g, '($1).trim()');
                code = code.replace(/замена\((.*?),\s*(.*?),\s*(.*?)\)/g, '($1).replace($2, $3)');
                code = code.replace(/содержит\((.*?),\s*(.*?)\)/g, '($1).includes($2)');
                code = code.replace(/разбить\((.*?),\s*(.*?)\)/g, '($1).split($2)');
                code = code.replace(/повторить_стр\((.*?),\s*(.*?)\)/g, '($1).repeat($2)');
                code = code.replace(/индекс_стр\((.*?),\s*(.*?)\)/g, '($1).indexOf($2)');
                code = code.replace(/срез\((.*?),\s*(.*?),\s*(.*?)\)/g, '($1).substring($2, $3)');
                code = code.replace(/начинается_с\((.*?),\s*(.*?)\)/g, '($1).startsWith($2)');
                code = code.replace(/заканчивается_на\((.*?),\s*(.*?)\)/g, '($1).endsWith($2)');
                code = code.replace(/символ_в\((.*?),\s*(.*?)\)/g, '($1).charAt($2)');
                code = code.replace(/код_символа\((.*?),\s*(.*?)\)/g, '($1).charCodeAt($2)');
                code = code.replace(/из_кода_символа\((.*?)\)/g, 'String.fromCharCode($1)');
                code = code.replace(/корень\((.*?)\)/g, 'Math.sqrt($1)');
                code = code.replace(/модуль\((.*?)\)/g, 'Math.abs($1)');
                code = code.replace(/округление\((.*?)\)/g, 'Math.round($1)');
                code = code.replace(/округлить_вниз\((.*?)\)/g, 'Math.floor($1)');
                code = code.replace(/округлить_вверх\((.*?)\)/g, 'Math.ceil($1)');
                code = code.replace(/степень\((.*?),\s*(.*?)\)/g, 'Math.pow($1, $2)');
                code = code.replace(/случайно\((.*?),\s*(.*?)\)/g, '(Math.floor(Math.random() * ($2 - $1 + 1)) + Number($1))');
                code = code.replace(/макс\((.*?),\s*(.*?)\)/g, 'Math.max($1, $2)');
                code = code.replace(/мин\((.*?),\s*(.*?)\)/g, 'Math.min($1, $2)');
                code = code.replace(/пи\(\)/g, 'Math.PI');
                code = code.replace(/синус\((.*?)\)/g, 'Math.sin($1)');
                code = code.replace(/косинус\((.*?)\)/g, 'Math.cos($1)');
                code = code.replace(/тангенс\((.*?)\)/g, 'Math.tan($1)');
                code = code.replace(/лог\((.*?)\)/g, 'Math.log($1)');
                code = code.replace(/массив_создать\((.*?)\)/g, '[$1]');
                code = code.replace(/массив_добавить\((.*?),\s*(.*?)\)/g, '($1).push($2)');
                code = code.replace(/массив_удалить_последний\((.*?)\)/g, '($1).pop()');
                code = code.replace(/массив_объединить\((.*?),\s*(.*?)\)/g, '($1).join($2)');
                code = code.replace(/массив_развернуть\((.*?)\)/g, '($1).reverse()');
                code = code.replace(/массив_сортировать\((.*?)\)/g, '($1).sort()');
                code = code.replace(/массив_индекс\((.*?),\s*(.*?)\)/g, '($1).indexOf($2)');
                code = code.replace(/массив_вырезать\((.*?),\s*(.*?),\s*(.*?)\)/g, '($1).slice($2, $3)');
                code = code.replace(/массив_заполнить\((.*?),\s*(.*?)\)/g, '($1).fill($2)');
                code = code.replace(/массив_включает\((.*?),\s*(.*?)\)/g, '($1).includes($2)');
                code = code.replace(/в_строку\((.*?)\)/g, 'String($1)');
                code = code.replace(/в_число\((.*?)\)/g, 'Number($1)');
                code = code.replace(/это_число\((.*?)\)/g, '(!isNaN(Number($1)))');
                code = code.replace(/это_массив\((.*?)\)/g, 'Array.isArray($1)');
                code = code.replace(/время_сейчас\(\)/g, 'Date.now()');
                code = code.replace(/дата_текст\(\)/g, 'new Date().toLocaleString("ru-RU")');
                code = code.replace(/ошибка\((.*?)\)/g, 'throw new Error($1)');
                code = code.replace(/айди_программы\(\)/g, 'crypto.randomUUID()');

                eval(code);
                consoleOut.innerText = outputBuffer || "Программа успешно выполнена.";
            } catch (err) {
                consoleOut.innerHTML = '<span class="error">Ошибка компиляции Triton: ' + err.message + '</span>';
            }
        }
    </script>
</body>
</html>
